[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "organoid-oxygen-lab"
version = "0.1.0"
description = "Conservative spherical oxygen diffusion and uptake modeling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Dylan Stechmann"}]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
oxygenlab = "oxygenlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
